<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>TrafficMap</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>
  <main id="app">
    <div id="map"></div>

    <aside class="side-toolbar">
      <section class="toolbar-section toolbar-identity">
        <div
          id="connection"
          class="connection offline"
        >
          <span class="connection-dot"></span>
          <span>disconnected</span>
        </div>

        <div class="server-info">
          <h1 id="server-name">Server</h1>

          <div class="server-port">
            Traffic:
            <strong id="filter-mode">All ports</strong>
          </div>
        </div>
      </section>

      <section class="toolbar-section toolbar-filter">
        <label for="filter-port">
          Add port filter
        </label>

        <input
          id="filter-port"
          type="number"
          min="1"
          max="65535"
          step="1"
          inputmode="numeric"
          placeholder="1–65535"
        >

        <select id="filter-protocol">
          <option value="tcp">TCP</option>
          <option value="udp">UDP</option>
          <option value="both">TCP + UDP</option>
        </select>

        <button id="add-filter" type="button">Add</button>
        <div id="filter-error" class="filter-error" role="status"></div>
      </section>

      <section class="toolbar-section toolbar-filter">
        <label for="activity-window">
          Show clients with traffic in the last
        </label>

        <select id="activity-window">
          <option value="5">5 seconds</option>
          <option value="10">10 seconds</option>
          <option value="30">30 seconds</option>
          <option value="60">60 seconds</option>
        </select>
      </section>

      <section class="toolbar-section toolbar-stats">
        <article class="toolbar-stat">
          <span>Active</span>
          <strong id="active-clients">0</strong>
        </article>

        <article class="toolbar-stat">
          <span>Mapped</span>
          <strong id="mapped-clients">0</strong>
        </article>

        <article class="toolbar-stat">
          <span>Inbound</span>
          <strong id="recent-in">0 B</strong>
        </article>

        <article class="toolbar-stat">
          <span>Outbound</span>
          <strong id="recent-out">0 B</strong>
        </article>

        <article class="toolbar-stat toolbar-stat-wide">
          <span>Visible total</span>
          <strong id="total">0 B</strong>
        </article>
      </section>
    </aside>

    <section id="active-filters" class="filter-stats-panel" hidden></section>

    <div
      id="empty"
      class="empty-message"
    >
      No matching TCP or UDP traffic.
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script
    type="module"
    src="./app.js"
  ></script>
</body>
</html>
